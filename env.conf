###############################################################
#  UpinelAIOS for Mac - user configuration
#
#  This is the ONLY file you need to edit.
#  Every setting has a working default for an M5 Pro / 64 GB Mac.
#  Re-run ./start.sh after any change.
###############################################################

# ─────────────────────────────────────────────────────────────
# 1. MODEL
# ─────────────────────────────────────────────────────────────
# The model to serve. Any MTPLX-format Hugging Face repo will do: an MLX
# conversion whose MTP head has been forged and verified. Give the full
# "owner/name" id, or one of the short aliases below.
#
# Tested options:
#
#   alias        size   repo
#   ----------   -----  ------------------------------------------------------
#   4bit         15 GB  itrejomx/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTPLX-4bit
#   6bit         23 GB  itrejomx/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTPLX-6bit
#   4bit-opus    17 GB  barozp/Qwen3.8-27B-Opus-Distill-v2-MTPLX-4bit
#   6bit-opus    24 GB  barozp/Qwen3.8-27B-Opus-Distill-v2-MTPLX-6bit
#    moe          21 GB  Youssofal/Qwen3.6-35B-A3B-MTPLX-Optimized-Speed
#   9b            6 GB  Youssofal/Qwen3.5-9B-MTPLX-Optimized-Speed
#    official     20 GB  Youssofal/Qwen3.8-27B-MTPLX-Optimized-Speed
#
# Notes on the choices:
#   * 4bit / 6bit are the same uncensored HauhauCS Aggressive fine-tune at two
#     precisions. 4-bit is the fastest and the smallest; 6-bit is closer to the
#     original and still fits 262k context on a 64 GB Mac.
#   * 4bit-opus / 6bit-opus are a different fine-tune (Opus distillation), also
#     uncensored and MTPLX-verified, tuned more toward coding and agent work.
#   * official is Qwen's own model, so it is ALIGNED, not uncensored. It is the
#     only one carrying a vision tower.
#   * "moe" is a mixture-of-experts model: 35B total but only 3B active per
#     token, so it is several times faster than the dense 27B for the same
#     memory footprint. This is the option to pick if you want 75+ tok/s.
#   * "9b" is the small-Mac option and fits comfortably in 32 GB.
#   * The default 4-bit runs on a 32 GB Mac. The 6-bit builds want 64 GB.
#
# install.sh scans your hardware and will offer to change this for you.
MODEL="itrejomx/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTPLX-4bit"

# Where model weights live. Kept out of git (see .gitignore).
# Expect 15-25 GB here once install.sh has finished.
MODELS_DIR="$REPO_DIR/models"

# ─────────────────────────────────────────────────────────────
# 2. CONTEXT  (the big one)
# ─────────────────────────────────────────────────────────────
# This model is a HYBRID: only 16 of its 64 layers keep a KV cache, so
# context is far cheaper than on a normal 27B. Measured KV cost per token:
#     f16 KV = 64 KB/token   q8 KV = 34 KB/token   q4 KV = 18 KB/token
#
#   context     f16 KV    q8 KV    q4 KV
#   --------    ------    -----    -----
#    131072      8.0 GB    4.3 GB   2.3 GB      <- 128K, the default
#    204800     12.5 GB    6.7 GB   3.5 GB      <- 200K
#    262144     16.0 GB    8.5 GB   4.5 GB      <- model maximum
#
# Add the model size on top (15 GB for 4bit, 23 GB for 6bit).
# 4bit + 262144 + q8 KV = ~24 GB total. Comfortable on 64 GB.
CONTEXT_WINDOW=131072

# Hard ceiling on tokens the server will generate per reply.
MAX_RESPONSE_TOKENS=32768

# KV cache quantization:  off | q8 | q4
#   off  fastest possible decode, largest memory
#   q8   ~2x smaller KV, decodes through a fused inline-dequant kernel.
#        RECOMMENDED - big memory win, negligible decode cost. Default.
#   q4   smallest KV, but decode re-dequantizes every step (slower on
#        long context). Use only if you are out of memory.
KV_QUANT="q8"

# ─────────────────────────────────────────────────────────────
# 3. THINKING / REASONING
# ─────────────────────────────────────────────────────────────
#   off     no thinking block at all. DEFAULT. Fastest and most predictable.
#   low     brief reasoning. The model is asked to keep thinking short, but
#           it is a soft nudge and it often does not comply.
#   medium  no instruction is sent at all for this level - the model thinks
#           freely. Slower than "low" in practice, and easy to misread as a
#           middle setting. It is not.
#   high    deep reasoning (maps to the model's 'xhigh').
#
# Measured on a trivial question ("what is 17*23?"):
#     off      4 completion tokens,  0 of them reasoning
#     low     62 completion tokens, 55 of them reasoning
#     medium  63 completion tokens, 56 of them reasoning
#
# Thinking tokens are generated at the same speed as answer tokens, so they are
# pure latency for an agent that just needs to call a tool. "low" does not
# reliably stop that. Set it to "off" unless a task genuinely needs reasoning.
#
# A client can override this per request without restarting the server:
#   "chat_template_kwargs": {"enable_thinking": false}
THINKING="off"

# How much of the model's thinking is kept in the conversation history that
# gets re-sent on every turn.
#
#   scoped  keep reasoning only inside the current agent round. DEFAULT.
#           This is the trained contract, and it stops history from growing
#           without bound as an agent works.
#   auto    MTPLX decides per model. For this model that resolves to "on".
#   on      preserve all reasoning forever.
#   off     strip all reasoning from history.
#
# This matters more than it looks. Measured on a live agent session: with
# "on", thinking history accumulated to ~35,000 characters, the prompt grew
# to 34,500 tokens, and decode fell from 22.4 to 11.3 tok/s - half the speed,
# for tokens the model had already finished with.
PRESERVE_THINKING="scoped"

# ─────────────────────────────────────────────────────────────
# 4. SPEED
# ─────────────────────────────────────────────────────────────
# MTP speculative-decoding depth. "auto" uses the value measured for
# this machine by ./install.sh (or re-measure any time: ./bench/bench.sh --tune).
# Set a number 1-3 to pin it. Set 0 to disable MTP (always slower here).
MTP_DEPTH="auto"

# Runtime profile:
#   sustained  long-context path: chunked prefill, paged per-request KV,
#              memory-safe at long context. DEFAULT, and the right choice
#              if you use more than ~32k of context.
#   turbo      fastest decode at short context: adds NAX verify kernels and
#              compiled verify (exact to 32768 tokens, then falls back).
#              Its prefill path allocates far more aggressively, which is
#              what causes Metal OOM at long context. Use it only if you
#              stay under ~32k.
PROFILE="sustained"

# Batching preset for concurrent clients:
#   solo | latency | agent | throughput
# "agent" is tuned for coding-agent traffic (few sessions, long shared
# prefixes, bursty). Default.
BATCHING_PRESET="agent"

# Max simultaneous in-flight requests. 1 = lowest latency for one client.
# 2-4 = better total throughput when several agents share the box.
MAX_CONCURRENT=4

# How many tokens to accumulate before emitting an SSE chunk.
# 1 = smoothest token-by-token streaming. Higher = less overhead.
STREAM_INTERVAL=1

# Prefill chunk size: how many prompt tokens are ingested per Metal pass.
#
# Smaller = smaller peak Metal allocation, slightly slower prefill.
# This is the fix for the most common long-context failure on a 64 GB Mac:
# a single huge prefill can exceed the Metal command-buffer allocation limit
# and fail with kIOGPUCommandBufferCallbackErrorOutOfMemory (HTTP 500), which
# looks like an out-of-RAM error but is not. 2048 avoids it. 0 = profile default.
PREFILL_CHUNK_TOKENS=2048

# Keep multi-turn session prefixes on SSD so a restart, or a client that
# reconnects, does not re-prefill a 100k-token conversation.
#   on | write-only | off
SSD_SESSION_CACHE="on"

# ─────────────────────────────────────────────────────────────
# 5. MEMORY
# ─────────────────────────────────────────────────────────────
# Total unified memory the inference process may use, in GB.
# 64 GB Mac: 48 leaves ~16 GB for macOS + your editor + the browser.
# 32 GB Mac: set 24.   96 GB Mac: set 72.   128 GB Mac: set 100.
#
# Raising this past ~85% of physical RAM makes jetsam kills and swap storms
# more likely, not less. The weights plus a 128k q8 KV cache need ~24 GB, so
# 48 is comfortably above what this model requires.
MEMORY_LIMIT_GB=48

# macOS GPU wired-memory ceiling in GB. 0 = leave macOS default.
#
# macOS defaults to roughly 75% of RAM (48 GB on a 64 GB Mac), which is
# already enough for every config in this file. Only raise this if you
# see "out of memory" during a very long prefill.
#
# DO NOT set this close to physical RAM - it makes jetsam kills far more
# likely, and a hard-killed process can leak wired pages until reboot.
# Applying it needs sudo; install.sh will ask once.
WIRED_LIMIT_GB=0

# Prefix/session bank: how much RAM to spend caching committed conversation
# prefixes so a returning agent does not re-prefill a 100k-token context.
#
# This is the single biggest memory consumer after the weights, and MTPLX
# auto-sizes it to "half of post-model RAM surplus" - 16.6 GB on a 64 GB Mac
# with a 48 GB cap. That is generous enough to push macOS into swap when you
# also use a long KV cache, which costs far more than the cache saves.
#
#   0        let MTPLX auto-size (can be 16 GB+ on a 64 GB Mac)
#   4-8      a good balance: recent sessions stay warm, OS keeps its headroom
#   16+      many concurrent agents with long stable prefixes
SESSION_BANK_GB=8

# Cap on MLX's reclaimable buffer cache. 0 = MTPLX default (memory/8, ~6 GB).
# Lower it first if you are swapping; the pages are reclaimable but MLX holds
# them wired, so they are not available to the page cache.
MLX_CACHE_LIMIT_GB=0

# ─────────────────────────────────────────────────────────────
# 6. NETWORK  (LAN sharing)
# ─────────────────────────────────────────────────────────────
# 0.0.0.0 = reachable from every device on your LAN.
# 127.0.0.1 = this Mac only (loopback needs no API key).
HOST="0.0.0.0"
PORT=8000

# Serving on a non-loopback address REQUIRES an API key - MTPLX refuses
# to bind otherwise. A key is generated on first start if the file is
# missing. Clients send it as:  Authorization: Bearer <key>
API_KEY_FILE="$REPO_DIR/run/api-key"

# The name clients ask for in the "model" field of /v1/chat/completions.
# Set to "auto" to advertise the real model directory name instead.
SERVED_MODEL_NAME="Upinel-AIOS"

# Requests/minute per client. 0 = unlimited.
RATE_LIMIT=0

# ─────────────────────────────────────────────────────────────
# 7. THERMALS
# ─────────────────────────────────────────────────────────────
#   default  let macOS manage fans. Recommended.
#   smart    MTPLX boosts fans when hot (needs a one-time sudo unlock).
#   max      fans pinned high while the server runs. Loud, best sustained
#            clocks under a long agent workload.
FAN_MODE="default"

# ─────────────────────────────────────────────────────────────
# 8. ADVANCED  - leave these alone unless you are experimenting
# ─────────────────────────────────────────────────────────────
# Fan out n-gram table pre-read at load (Qwen Flash-Next family only,
# no effect on this model). auto|all|off|<GiB>
NGRAM_PREWARM="auto"

# Startup warmup generation length. 0 disables.
WARMUP_TOKENS=8

# Log file (rotated at 32 MB on each start).
LOG_FILE="$REPO_DIR/run/server.log"
